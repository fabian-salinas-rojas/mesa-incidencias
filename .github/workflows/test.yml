name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: incidencias_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d incidencias_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: incidencias_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Crear tablas y datos de prueba
        run: |
          psql "postgresql://ci_user:ci_password@127.0.0.1:5432/incidencias_db" -f db/schema.sql
          psql "postgresql://ci_user:ci_password@127.0.0.1:5432/incidencias_db" -f db/seed.sql

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: backend
        run: npm test